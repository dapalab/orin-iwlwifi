# SPDX-License-Identifier: GPL-2.0-only
#
# Publish a release: run build.yml, then publish exactly the files it built and tested.
#
# Started by hand (Actions > release > Run workflow), from main only. The tag is the date plus a
# counter, e.g. 2026.09.28-1, and is never reused or moved: a fix is a new release.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, e.g. 2026.09.28-1 (leave empty for today, next free number)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the release and its tag
      id-token: write        # keyless signing of the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the tag
        id: tag
        env:
          WANT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$WANT" ]; then
            tag=$WANT
          else
            today=$(date -u +%Y.%m.%d)
            n=$(git ls-remote --tags --refs origin "refs/tags/$today-*" | sed 's|.*/[0-9.]*-||' | sort -n | tail -1)
            tag=$today-$(( ${n:-0} + 1 ))
          fi
          if ! [[ $tag =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]]; then
            echo "::error::tag '$tag' must look like 2026.09.28-1"; exit 1
          fi
          # Tags are never reused, so refuse rather than overwrite.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::tag $tag already exists"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag from $GITHUB_SHA"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debs
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: driver-src
          path: dist/

      - name: Assemble the release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          scripts/assemble-release.sh "$TAG"
          scripts/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" > notes.md

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/release/* \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest
